name: Mobile CI-CD Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Which environment to build and distribute'
        required: true
        type: choice
        options:
          - qa
          - prod
        default: qa

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: install dependencies
        run: npm ci

      - name: run linter
        run: npm run lint

      - name: determine environment
        id: check_env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "env_type=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"

            COMMIT_MSG=$(git log -1 --pretty=%B $HEAD_SHA)
            echo "Last commit message: $COMMIT_MSG"

            if [[ "$COMMIT_MSG" == *"[ciqa]"* ]]; then
              echo "env_type=qa" >> $GITHUB_OUTPUT
              echo "should_build=true" >> $GITHUB_OUTPUT
            elif [[ "$COMMIT_MSG" == *"[ciprod]"* ]]; then
              echo "env_type=prod" >> $GITHUB_OUTPUT
              echo "should_build=true" >> $GITHUB_OUTPUT
            else
              echo "env_type=none" >> $GITHUB_OUTPUT
              echo "should_build=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: init environment file
        if: steps.check_env.outputs.should_build == 'true'
        run: |
          ENV=${{ steps.check_env.outputs.env_type }}
          echo "init $ENV"
          npm run init:$ENV

      - name: setup JDK
        if: steps.check_env.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: setup gradle cache
        if: steps.check_env.outputs.should_build == 'true'
        uses: gradle/actions/setup-gradle@v3

      - name: build APK
        if: steps.check_env.outputs.should_build == 'true'
        run: |
          ENV=${{ steps.check_env.outputs.env_type }}
          cd android
          ./gradlew "assemble${ENV^}Release" --no-daemon

      - name: setup Ruby and Bundler
        if: steps.check_env.outputs.env_type == 'qa'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      - name: upload to Firebase
        if: steps.check_env.outputs.env_type == 'qa'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID_QA: ${{ secrets.FIREBASE_APP_ID_QA }}
        run: |
          cd android
          bundle exec fastlane distribute_qa

      - name: send telegram notification
        if: steps.check_env.outputs.should_build == 'true'
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTHOR: ${{ github.actor }}
          BUILD_URL: 'https://console.firebase.google.com/project/playground-de524/appdistribution/app/android:com.playground.qa/releases'
          ENV_NAME: ${{ steps.check_env.outputs.env_type }}
        run: |
          TEXT="${ENV_NAME}-build completed! Author: ${AUTHOR}%0AAPK Link: ${BUILD_URL}"
          curl -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            -d "text=${TEXT}"
